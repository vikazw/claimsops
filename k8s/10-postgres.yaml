apiVersion: v1
kind: Secret
metadata:
  name: claims-db
  namespace: claims
type: Opaque
stringData:                      # lab only: real secrets come from Key Vault
  POSTGRES_USER: claims
  POSTGRES_PASSWORD: devpass
  POSTGRES_DB: claims
  DATABASE_URL: postgresql://claims:devpass@postgres:5432/claims
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: claims
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: claims
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        envFrom:
        - secretRef:
            name: claims-db
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "claims"]
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 512Mi}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi