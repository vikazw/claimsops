apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-api
  namespace: claims
  labels:
    app: claims-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: claims-api
  template:
    metadata:
      labels:
        app: claims-api
    spec:
      containers:
      - name: api
        image: claims-api:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: claims-db
              key: DATABASE_URL
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        startupProbe:                  # allows up to 60 s to boot
          httpGet: {path: /healthz, port: http}
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:                 # process only, forgiving
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:                # checks the database, quick to react
          httpGet: {path: /ready, port: http}
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: claims-api
  namespace: claims
  labels:
    app: claims-api
spec:
  selector:
    app: claims-api
  ports:
  - name: http
    port: 80
    targetPort: http