kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: claimsops
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 8080
- role: worker
- role: worker