name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vikazw/claims-api:${{ github.sha }}

jobs:
  build-test-ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the code
        run: pipx run ruff check app/

      - name: Build the image
        run: docker build -t "$IMAGE" app/

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Create a throwaway Kubernetes cluster
        uses: helm/kind-action@v1

      - name: Deploy and smoke-test in Kubernetes
        run: |
          kind load docker-image "$IMAGE" --name chart-testing
          sed -i "s|image: claims-api:1.0|image: $IMAGE|" k8s/20-api.yaml
          kubectl apply -f k8s/00-namespace.yaml -f k8s/10-postgres.yaml
          kubectl rollout status statefulset/postgres -n claims --timeout=180s
          kubectl apply -f k8s/
          kubectl rollout status deployment/claims-api -n claims --timeout=180s
          kubectl run smoke -n claims --rm -i --restart=Never --image=curlimages/curl -- \
            curl -sf http://claims-api/ready

      - name: Push the image (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"