# Lightweight kube-prometheus-stack settings for an 8 GB laptop
defaultRules:
  create: false          # skip ~150 built-in rules; we use our own 4 in k8s/monitoring/alerts.yaml
kubeEtcd:
  enabled: false         # these four can't be scraped in kind anyway
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
nodeExporter:
  enabled: false         # machine-level metrics; not needed for our dashboards
prometheus:
  prometheusSpec:
    retention: 6h        # keep 6 hours of data instead of 10 days
    resources:
      requests: {memory: 256Mi}
      limits: {memory: 512Mi}
alertmanager:
  alertmanagerSpec:
    resources:
      requests: {memory: 32Mi}
      limits: {memory: 64Mi}
grafana:
  resources:
    requests: {memory: 128Mi}
    limits: {memory: 256Mi}
